# India-only job feed.
#
# Two things keep this India-only:
#   1. The companies below either are Indian, or run large India offices.
#   2. discovery.india_only() drops any posting that is not in India, so even a
#      global company on this list contributes only its India roles. A user here
#      never scores a job they could not take.
#
# All slugs verified live on 2026-08-30. Add more the same way — open a careers
# page and read the slug out of the URL:
#   job-boards.greenhouse.io/SLUG   -> greenhouse
#   jobs.lever.co/SLUG              -> lever
#   jobs.ashbyhq.com/SLUG           -> ashby

greenhouse:
  - postman          # dev tools, Bengaluru/Hyderabad
  - groww            # fintech, Bengaluru
  - observeai        # SaaS, Bengaluru
  - druva            # SaaS, Pune
  - mongodb          # India offices — india_only trims the rest
  - databricks       # India offices — india_only trims the rest
  - scaleai          # India roles — india_only trims the rest

lever:
  - meesho           # e-commerce, Bengaluru
  - cred             # fintech, Bengaluru

ashby:
  - atlan            # data, Bengaluru/Delhi
  - incident         # incident.io — India + remote
  - navi             # fintech, Bengaluru

# MNC India offices — the strongest fit for a support / operations / SRE profile,
# searched for India roles specifically so the two-call cost stays bounded.
workday:
  - tenant: nvidia
    wd: wd5
    site: NVIDIAExternalCareerSite
    search: ["technical support India", "site reliability India", "operations India"]
    max: 40
  - tenant: salesforce
    wd: wd12
    site: External_Career_Site
    search: ["technical support India", "cloud support India", "operations India"]
    max: 40
  - tenant: adobe
    wd: wd5
    site: external_experienced
    search: ["technical support India", "cloud operations India"]
    max: 40
  - tenant: accenture
    wd: wd103
    site: AccentureCareers
    search: ["cloud support India", "infrastructure engineer India", "service desk India"]
    max: 40
  - tenant: micron
    wd: wd1
    site: External
    search: ["IT support India", "systems engineer India", "operations India"]
    max: 40
  - tenant: hitachi
    wd: wd1
    site: hitachi
    search: ["technical support India", "cloud engineer India", "infrastructure India"]
    max: 40
