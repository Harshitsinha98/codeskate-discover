# Job feed — tuned for India.
#
# Two groups, both verified live on 2026-08-30:
#   greenhouse/lever/ashby : Indian product companies and startups
#   workday                : MNCs with large India offices, searched for India roles
#
# The Workday section matters most for a support/operations/SRE profile: MNC India
# offices hire heavily for exactly those roles, and they publish on Workday. The
# search terms are set to India + support/operations so the two-call-per-posting
# cost stays bounded.
#
# To add a company: open its careers page and read the URL.
#   job-boards.greenhouse.io/SLUG   -> greenhouse
#   jobs.lever.co/SLUG              -> lever
#   jobs.ashbyhq.com/SLUG           -> ashby

greenhouse:
  - postman
  - groww

lever:
  - meesho
  - cred

ashby:
  - atlan
  - incident

# MNC India offices — where a service-desk / support / ops / SRE profile fits best.
workday:
  - tenant: nvidia
    wd: wd5
    site: NVIDIAExternalCareerSite
    search: ["technical support India", "site reliability India", "operations India"]
    max: 40
  - tenant: salesforce
    wd: wd12
    site: External_Career_Site
    search: ["technical support India", "cloud support India", "operations India"]
    max: 40
  - tenant: adobe
    wd: wd5
    site: external_experienced
    search: ["technical support India", "cloud operations India"]
    max: 40
  - tenant: accenture
    wd: wd103
    site: AccentureCareers
    search: ["cloud support India", "infrastructure engineer India", "service desk India"]
    max: 40
  - tenant: micron
    wd: wd1
    site: External
    search: ["IT support India", "systems engineer India", "operations India"]
    max: 40
  - tenant: thomsonreuters
    wd: wd5
    site: External_Career_Site
    search: ["technical support India", "cloud operations India"]
    max: 40
  - tenant: hitachi
    wd: wd1
    site: hitachi
    search: ["technical support India", "cloud engineer India", "infrastructure India"]
    max: 40
