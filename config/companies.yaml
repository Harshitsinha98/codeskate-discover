# Your job feed. Each entry is a company's ATS board slug — these endpoints are
# public, free and keyless. Growing this list is the single highest-leverage
# thing you can do for match quality.
#
# How to find a slug: open a company's careers page and look at the URL.
#   job-boards.greenhouse.io/SLUG   -> greenhouse
#   jobs.lever.co/SLUG              -> lever
#   jobs.ashbyhq.com/SLUG           -> ashby
#
# Every slug below was verified live on 2026-08-30 and returned postings.
# Boards go stale — `codeskate discover` reports dead slugs and skips them safely.
#
# TODO(you): replace these US-centric names with companies you would actually
# join. 200-300 relevant slugs beats 4000 jobs you don't want.

greenhouse:
  - affirm
  - airbnb
  - anthropic
  - asana
  - brex
  - cloudflare
  - coinbase
  - databricks
  - discord
  - dropbox
  - duolingo
  - figma
  - flexport
  - gitlab
  - instacart
  - reddit
  - robinhood
  - samsara
  - sofi
  - stripe
  - twilio
  - zscaler

lever:
  - palantir
  - spotify
  - matchgroup

ashby:
  - linear
  - vanta

# ---------------------------------------------------------------------------
# Workday — how most large MNCs publish, including their India requisitions.
# Greenhouse/Lever/Ashby barely cover MNCs, so without this section the feed
# skews to US startups.
#
# Two calls per posting (list, then detail for the JD), so narrow it:
#   search  one term or a list; Workday filters server-side, for free.
#           Including "India" in the term cuts most of the noise immediately.
#   max     cap per search term. 40 is plenty while tuning.
#
# Finding the three values: open the careers site and read the URL —
#   https://TENANT.WD.myworkdayjobs.com/SITE
# e.g. nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#
# All ten below were verified live on 2026-08-30.
workday:
  - tenant: nvidia
    wd: wd5
    site: NVIDIAExternalCareerSite
    search: ["site reliability India", "technical support engineer India"]
    max: 40

  - tenant: salesforce
    wd: wd12
    site: External_Career_Site
    search: ["site reliability India", "technical support engineer India"]
    max: 40

  - tenant: adobe
    wd: wd5
    site: external_experienced
    search: ["site reliability India", "cloud operations India"]
    max: 40

  - tenant: accenture
    wd: wd103
    site: AccentureCareers
    search: ["site reliability engineer India", "cloud engineer India"]
    max: 40

  - tenant: paypal
    wd: wd1
    site: jobs
    search: ["site reliability India", "production support India"]
    max: 40

  - tenant: micron
    wd: wd1
    site: External
    search: ["site reliability India", "IT operations India"]
    max: 40

  - tenant: thomsonreuters
    wd: wd5
    site: External_Career_Site
    search: ["site reliability India", "cloud operations India"]
    max: 40

  - tenant: hitachi
    wd: wd1
    site: hitachi
    search: ["site reliability India", "cloud engineer India"]
    max: 40

  - tenant: workday
    wd: wd5
    site: Workday
    search: ["site reliability India", "technical support India"]
    max: 40

  - tenant: broadcom
    wd: wd1
    site: External_Career
    search: ["site reliability India", "technical support India"]
    max: 40
