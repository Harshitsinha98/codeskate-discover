# EDIT THIS FIRST — it drives the free prefilter and the LLM's constraints.
# Getting this right costs nothing and saves most of your API budget.

# A job title must contain at least one of these (case-insensitive substring).
title_include:
  - software engineer
  - backend
  - back end
  - full stack
  - fullstack
  - platform engineer
  - developer

# ...and none of these. Add aggressively — every exclusion is free savings.
title_exclude:
  - intern
  - director
  - vice president
  - principal
  - staff
  - manager
  - sales
  - recruiter
  - marketing
  - support

# Empty list = accept any location.
locations:
  - bangalore
  - bengaluru
  - hyderabad
  - pune
  - india
remote_ok: true

# "Remote" is usually region-locked. A posting saying "Remote, USA" is useless
# if you can't work in the USA, so drop remote roles pinned to these regions.
remote_exclude_regions:
  - usa
  - united states
  - us only
  - canada
  - emea
  - united kingdom
  - europe
  - latam
  - brazil
  - australia

# Postings shorter than this are usually stubs — not worth an LLM call.
min_description_chars: 300

# Passed to the scoring model as hard constraints.
constraints:
  years_of_experience: 2
  work_authorisation: "India (no sponsorship needed); no US/EU work permit"
  minimum_salary_inr_lpa: 18
  notice_period: "30 days"
  open_to_relocation: true
  employment_type: "full-time"
