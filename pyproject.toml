[project]
name = "codeskate"
version = "0.1.0"
description = "A team of AI agents that finds and wins you a better job."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=4.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
codeskate = "codeskate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeskate"]

[tool.ruff]
line-length = 100
target-version = "py311"
